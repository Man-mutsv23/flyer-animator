image: node:20

stages:
  - test
  - sync

# Stage 1: Check TypeScript build
build-and-test:
  stage: test
  script:
    - npm install
    - npx tsc --noEmit
    - npm run build --if-present

# Stage 2: Push clean code to GitHub automatically
sync-to-github:
  stage: sync
  script:
    - git push --force https://${GITHUB_TOKEN}@github.com/Man-mutsv23/flyer-animator.git HEAD:main
  only:
    - main
